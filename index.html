<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#28150f">
  <title>Friendsgiving · You're Invited</title>
  <style>
    :root {
      --cream: #f8dfbd;
      --cream-soft: #f2d2a9;
      --ink: #2b170f;
      --amber: #e8a45d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at 12% 82%, rgba(173,76,25,.30), transparent 32%),
        radial-gradient(ellipse at 85% 12%, rgba(186,105,43,.20), transparent 34%),
        linear-gradient(135deg, #160d0a 0%, #4b2819 48%, #1c100c 100%);
      overflow-x: hidden;
    }
    .lights {
      position: fixed; inset: 0 0 auto; height: 150px; pointer-events: none;
      opacity: .95; z-index: 0;
    }
    .wire {
      position: absolute; left: -3%; right: -3%; top: 25px; height: 100px;
      border-top: 2px solid rgba(15,10,8,.8); border-radius: 50%;
      transform: rotate(3deg);
    }
    .bulb {
      position: absolute; top: var(--top); left: var(--left);
      width: 10px; height: 17px; border-radius: 50% 50% 45% 45%;
      background: #ffd38a; box-shadow: 0 0 8px 4px #ffbd62, 0 0 24px 9px rgba(255,163,65,.55);
      animation: twinkle 2.6s ease-in-out infinite alternate;
      animation-delay: var(--delay);
    }
    @keyframes twinkle { from { opacity: .65; filter: brightness(.85); } to { opacity: 1; filter: brightness(1.3); } }
    .page {
      position: relative; z-index: 1; width: min(100% - 32px, 760px);
      margin: 0 auto; padding: 72px 0 48px;
    }
    .invitation {
      position: relative; overflow: hidden; text-align: center;
      padding: clamp(28px, 6vw, 58px) clamp(18px, 6vw, 62px);
      border: 1px solid rgba(248,223,189,.28);
      border-radius: 5px;
      background: linear-gradient(155deg, rgba(38,20,14,.88), rgba(57,29,18,.83));
      box-shadow: 0 25px 80px rgba(0,0,0,.42), inset 0 0 70px rgba(215,133,67,.08);
      backdrop-filter: blur(5px);
    }
    .invitation::before, .invitation::after {
      content: "✦"; position: absolute; color: rgba(239,174,111,.18);
      font-size: 110px; line-height: 1; pointer-events: none;
    }
    .invitation::before { left: -26px; bottom: 30px; transform: rotate(-18deg); }
    .invitation::after { right: -24px; top: 80px; transform: rotate(18deg); }
    .ornament { display: flex; align-items: center; justify-content: center; gap: 18px; color: var(--cream-soft); }
    .ornament span { width: 105px; height: 1px; background: var(--cream-soft); opacity: .8; }
    .heart { font-size: 38px; line-height: 1; font-family: Arial, sans-serif; font-weight: 200; }
    .eyebrow {
      margin: 18px 0 2px; font-size: clamp(13px, 2vw, 17px);
      letter-spacing: .29em; text-transform: uppercase;
    }
    h1 {
      margin: 4px -10px 0; color: #ffd09b;
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(58px, 12vw, 105px); font-weight: 400;
      line-height: 1.05; letter-spacing: -.045em;
      text-shadow: 0 0 24px rgba(255,173,98,.26);
    }
    .underline {
      width: min(250px, 62%); height: 12px; margin: 0 auto 22px;
      border-top: 2px solid #eab27c; border-radius: 50%; transform: rotate(-2deg);
    }
    .details { display: grid; gap: 17px; justify-content: center; margin: 26px auto 24px; }
    .detail {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      color: var(--cream); font-size: clamp(19px, 4.3vw, 29px);
      letter-spacing: .105em; text-transform: uppercase;
    }
    .detail svg { flex: 0 0 31px; width: 31px; height: 31px; stroke: #f5c895; fill: none; stroke-width: 1.7; }
    .bring {
      margin: 30px 0 10px; color: #f8d0a6;
      font-family: "Brush Script MT", "Segoe Script", cursive;
      font-size: clamp(30px, 7vw, 49px); font-style: italic; line-height: 1.13;
    }
    .little-heart { font-family: Arial, sans-serif; font-size: 35px; margin: 4px 0 18px; }
    .rsvp {
      position: relative; z-index: 2; max-width: 460px; margin: 30px auto 0;
      padding: 24px 22px 22px; border-top: 1px solid rgba(248,223,189,.3);
      background: rgba(20,11,8,.28);
    }
    .rsvp h2 { margin: 0 0 8px; font-size: 23px; font-weight: 400; letter-spacing: .16em; text-transform: uppercase; }
    .rsvp p { margin: 0 0 18px; color: #e8c7a4; font-size: 15px; }
    label { display: block; text-align: left; margin: 0 0 8px; color: #f7d8b5; font-size: 14px; letter-spacing: .08em; }
    input {
      width: 100%; padding: 14px 15px; border: 1px solid rgba(248,223,189,.55);
      border-radius: 2px; outline: none; background: rgba(255,245,231,.96);
      color: #2a170f; font: 16px Georgia, serif;
    }
    input:focus { border-color: #ffc77f; box-shadow: 0 0 0 3px rgba(255,199,127,.16); }
    button {
      width: 100%; margin-top: 13px; padding: 14px 18px; border: 1px solid #f6c58f;
      border-radius: 2px; background: #e6ad72; color: #2d180f;
      font: 600 14px Georgia, serif; letter-spacing: .17em; text-transform: uppercase;
      cursor: pointer; transition: background .2s, transform .2s;
    }
    button:hover { background: #f2c18e; transform: translateY(-1px); }
    button:disabled { opacity: .65; cursor: wait; transform: none; }
    #status { min-height: 22px; margin: 13px 0 0; font-size: 14px; color: #f8d8b5; }
    .footer { margin-top: 20px; color: rgba(248,223,189,.65); font-size: 12px; letter-spacing: .12em; }
    @media (max-width: 480px) {
      .page { width: min(100% - 18px, 760px); padding-top: 54px; }
      .invitation { padding-left: 14px; padding-right: 14px; }
      .detail { gap: 10px; letter-spacing: .06em; }
      .detail svg { flex-basis: 25px; width: 25px; height: 25px; }
      .ornament span { width: 70px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="lights" aria-hidden="true">
    <div class="wire"></div>
    <i class="bulb" style="--left:5%;--top:22px;--delay:.2s"></i>
    <i class="bulb" style="--left:17%;--top:65px;--delay:1s"></i>
    <i class="bulb" style="--left:30%;--top:35px;--delay:.5s"></i>
    <i class="bulb" style="--left:45%;--top:78px;--delay:1.4s"></i>
    <i class="bulb" style="--left:58%;--top:24px;--delay:.8s"></i>
    <i class="bulb" style="--left:72%;--top:60px;--delay:1.8s"></i>
    <i class="bulb" style="--left:88%;--top:28px;--delay:.4s"></i>
  </div>

  <main class="page">
    <section class="invitation" aria-labelledby="title">
      <div class="ornament"><span></span><div class="heart">♡</div><span></span></div>
      <p class="eyebrow">You're invited to</p>
      <h1 id="title">Friendsgiving</h1>
      <div class="underline"></div>

      <div class="details">
        <div class="detail">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="1"></rect><path d="M7 2v4M17 2v4M3 9h18M7 13h2m3 0h2m3 0h1M7 17h2m3 0h2"></path></svg>
          <span>Sunday, Nov 22</span>
        </div>
        <div class="detail">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 6v6l4 2"></path></svg>
          <span>7 PM</span>
        </div>
        <div class="detail">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
          <span>Cushion 148</span>
        </div>
      </div>

      <div class="underline"></div>
      <p class="bring">Bring a dish<br>and be ready to eat!</p>
      <div class="little-heart">♡</div>

      <form class="rsvp" id="rsvp-form">
        <h2>Kindly RSVP</h2>
        <p>Let us know you're coming!</p>
        <label for="full-name">Full name</label>
        <input id="full-name" name="Full name" type="text" autocomplete="name" placeholder="Your full name" required maxlength="100">
        <button id="submit-button" type="submit">Send RSVP</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
      <div class="footer">A night of food and friendship</div>
    </section>
  </main>

  <script>
    const form = document.getElementById('rsvp-form');
    const button = document.getElementById('submit-button');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      button.disabled = true;
      button.textContent = 'Sending…';
      status.textContent = '';

      const payload = new FormData(form);
      payload.append('_subject', 'New Friendsgiving RSVP');

      try {
        const response = await fetch('https://formsubmit.co/ajax/sushmitamandal100@gmail.com', {
          method: 'POST',
          headers: { 'Accept': 'application/json' },
          body: payload
        });
        const result = await response.json();

        if (response.ok && result.success) {
          status.textContent = 'Thank you! Your RSVP has been received. See you there! ♡';
          form.reset();
        } else {
          throw new Error(result.message || 'Unable to submit right now.');
        }
      } catch (error) {
        status.textContent = 'Sorry, your RSVP could not be sent. Please try again in a moment.';
      } finally {
        button.disabled = false;
        button.textContent = 'Send RSVP';
      }
    });
  </script>
</body>
</html>
